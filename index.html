<style>
  :root {
    color-scheme: light;
    --bg: #EAF4FC;
    --card: #FFFFFF;
    --line: #CFE3F5;
    --line-soft: #E1EFFA;
    --ink: #000000;
    --blue: #46648A;
    --green: #7FA986;
    --green-ink: #4F7358;
    --gold: #D9A64E;
    --amber: #A9762F;
    --red: #B2564A;
    --clay: #D97F72;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }

  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header.topbar { display: none; align-items: center; justify-content: space-between; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line); background: var(--card); flex-shrink: 0; }
  .layout { display: flex; flex: 1; min-height: 0; }
  aside { width: 220px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--card); padding: 24px 16px; display: flex; flex-direction: column; overflow-y: auto; }
  aside .logo { font-size: 20px; line-height: 1.2; margin-bottom: 4px; }
  aside .sub { font-size: 10px; color: var(--ink); margin-bottom: 20px; letter-spacing: 0.05em; }
  nav.sidenav { display: flex; flex-direction: column; gap: 4px; }
  nav.sidenav button, nav.bottomnav button { display: flex; align-items: center; gap: 10px; border: none; background: none; cursor: pointer; padding: 10px 12px; border-radius: 8px; font-size: 14px; color: var(--ink); text-align: left; width: 100%; }
  nav.sidenav button.active { background: var(--bg); color: var(--ink); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 24px 32px; max-width: 820px; }
  nav.bottomnav { display: none; border-top: 1px solid var(--line); background: var(--card); justify-content: space-around; padding: 6px 4px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); flex-shrink: 0; overflow-x: auto; }
  nav.bottomnav button { flex-direction: column; gap: 2px; min-width: 50px; padding: 6px 4px; font-size: 9px; text-align: center; }
  nav.bottomnav button.active { color: var(--ink); font-weight: 600; }
  .icon { width: 16px; height: 16px; display: inline-block; }
  .section-header { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.2em; color: var(--ink); text-transform: uppercase; margin-bottom: 4px; }
  .title { font-size: 28px; color: var(--ink); margin: 0; }
  .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 32px 16px; text-align: center; color: var(--ink); font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  input, select, textarea, button.pill { background: var(--card); border: 1px solid #DCD2AE; border-radius: 6px; padding: 9px 12px; color: var(--ink); font-size: 14px; font-family: inherit; }
  input::placeholder, textarea::placeholder { color: #6C6C6C; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn { border: none; border-radius: 6px; padding: 9px 16px; color: #fff; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-family: inherit; }

  .flex1 { flex: 1; min-width: 140px; }

  .stat-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .stat { flex: 1; min-width: 45%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .stat .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-family: 'SF Mono', Consolas, Menlo, monospace; }
  .stat .hint { font-size: 10px; color: #555; margin-top: 3px; }
  .check { flex-shrink: 0; width: 20px; height: 20px; border-radius: 4px; border: 1px solid #B9B2A0; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--card); }
  .check.done { background: var(--green); border-color: var(--green); color: #fff; }
  .trash { margin-left: auto; background: none; border: none; color: var(--ink); cursor: pointer; padding: 4px; font-family: inherit; font-size: 14px; }

  .cal-cell.done { background: var(--green); border-color: var(--green); color: #fff; }

  .subtabs, .filter-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; }
  .subtabs button, .filter-row button { border: 1px solid #DCD2AE; background: var(--card); color: var(--ink); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: 'SF Mono', monospace; }
  .subtabs button.active, .filter-row button.active { border-color: var(--ink); color: var(--ink); background: #DCEEFB; }

  table.sheet td input, table.sheet td select { width: 100%; padding: 6px 8px; font-size: 13px; }
  .sheet-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }

  /* ---- additions ---- */
  .banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #FCEDE9; border: 1px solid #E9BDB4; border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; font-size: 13px; }
  .banner.info { background: #FFF6E3; border-color: #E7CE93; }
  .scale { display: flex; gap: 6px; }
  .scale button { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 9px 0; font-family: 'SF Mono', monospace; font-size: 14px; cursor: pointer; color: var(--ink); }
  .scale button.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .scale button.on.warm { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .habit-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #B9B2A0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; background: var(--card); flex-shrink: 0; font-size: 11px; color: #fff; padding: 0; }
  .habit-dot.on { background: var(--green); border-color: var(--green); }
  .dots { display: flex; gap: 3px; align-items: center; }
  .dots i { width: 9px; height: 9px; border-radius: 2px; background: var(--line-soft); display: inline-block; }
  .dots i.on { background: var(--green); }
  .dots i.miss { background: #F0DCD8; }
  .tag { display: inline-block; font-family: 'SF Mono', monospace; font-size: 11px; background: #DCEEFB; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--ink); }
  .tag.warn { background: #FCEDE9; border-color: #E9BDB4; }
  .tag.ok { background: #E3F1E6; border-color: #B6D4BC; }
  .bar-row { margin-bottom: 12px; }
  .bar-track { height: 10px; background: var(--line-soft); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 4px; gap: 10px; }
  .modal-back { position: fixed; inset: 0; background: rgba(20,32,45,0.35); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 60; overflow-y: auto; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 620px; padding: 20px; box-shadow: 0 18px 50px rgba(20,32,45,0.18); }
  .goal-body { border-top: 1px solid var(--line-soft); margin-top: 12px; padding-top: 12px; }
  .mini-input { padding: 6px 10px; font-size: 13px; }
  .note-area { width: 100%; resize: vertical; min-height: 64px; font-family: inherit; font-size: 13px; }
  .split { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

  @media (min-width: 768px) { .split.two { grid-template-columns: 1fr 1fr; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
/* ============================================================
   Life Ledger — offline personal tracker
   Data lives in localStorage. Export regularly.
   ============================================================ */

// ---------- helpers ----------
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => fmtDate(new Date());
const parseDate = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const monthKey = (s) => (s || "").slice(0, 7);
const thisMonth = () => monthKey(todayStr());
const monthLabelOf = (y, m) => new Date(y, m, 1).toLocaleDateString("lt-LT", { month: "long", year: "numeric" });

const fmtMoney = (n) => (n < 0 ? "-€" : "€") + Math.abs(Number(n)||0).toLocaleString("lt-LT", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtMoney0 = (n) => (n < 0 ? "-€" : "€") + Math.round(Math.abs(Number(n)||0)).toLocaleString("lt-LT");
const sum = (arr) => arr.reduce((s,e)=>s+Number(e.amount||0),0);
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const attr = (s) => esc(s).replace(/\n/g, "&#10;");

function bucketOf(dateStr) {
  if (!dateStr) return "none";
  const t = todayStr();
  if (dateStr < t) return "overdue";
  if (dateStr === t) return "today";
  const diffDays = daysBetween(t, dateStr);
  if (diffDays <= 7) return "week";
  if (diffDays <= 31) return "month";
  return "later";
}
const BUCKETS = [["all","Visi"],["overdue","Pradelsta"],["today","Šiandien"],["week","Ši savaitė"],["month","Šis mėnuo"],["later","Vėliau"],["none","Be datos"]];
const BUCKET_LABEL = Object.fromEntries(BUCKETS);

// ---------- state ----------
const STORAGE_KEY = "life-dashboard-offline-v2"; // unchanged: keeps existing data
const EXPENSE_CATEGORIES = ["Būstas","Maistas","Transportas","Pramogos","Sąskaitos","Sveikata","Kita"];
const LEGACY_CAT_MAP = { Living:"Būstas", Food:"Maistas", Transport:"Transportas", Fun:"Pramogos", Bills:"Sąskaitos", Other:"Kita" };

function defaults() {
  return {
    todos: [], goals: [],
    finance: { income: [], investments: [], expenses: [], notes: {} },
    subscriptions: [], budgets: {}, netWorth: [],
    habits: [], workouts: {}, trading: {}, daily: {},
    meta: { lastBackup: null, schema: 3 },
  };
}

function loadData() {
  const def = defaults();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return def;
    const p = JSON.parse(raw);
    return migrate({
      ...def, ...p,
      finance: { ...def.finance, ...(p.finance||{}), notes: (p.finance&&p.finance.notes)||{} },
      meta: { ...def.meta, ...(p.meta||{}) },
    });
  } catch(e) { console.error("load failed", e); return def; }
}

// Non-destructive upgrade of older saves.
function migrate(d) {
  d.subscriptions = d.subscriptions || [];
  d.budgets = d.budgets || {};
  d.netWorth = d.netWorth || [];
  d.daily = d.daily || {};

  d.todos.forEach(t => { if (t.archived === undefined) t.archived = false; });
  d.goals.forEach(g => {
    if (g.archived === undefined) g.archived = false;
    if (g.why === undefined) g.why = "";
    if (g.manualProgress === undefined) g.manualProgress = Number(g.progress) || 0;
    if (!Array.isArray(g.habitIds)) g.habitIds = [];
  });
  d.habits.forEach(h => {
    if (h.archived === undefined) h.archived = false;
    if (!h.history) {
      h.history = {};
      // Old saves only kept lastDone + a streak count. Rebuild a plausible history
      // backwards from lastDone so streaks and dot-rows aren't reset to zero.
      if (h.lastDone) {
        const n = Math.max(1, Number(h.streak) || 1);
        for (let i = 0; i < n; i++) h.history[addDays(h.lastDone, -i)] = true;
      }
    }
  });
  // Translate old English expense categories once.
  (d.finance.expenses || []).forEach(e => { if (LEGACY_CAT_MAP[e.category]) e.category = LEGACY_CAT_MAP[e.category]; });
  Object.keys(d.budgets).forEach(k => {
    if (LEGACY_CAT_MAP[k]) { d.budgets[LEGACY_CAT_MAP[k]] = d.budgets[k]; delete d.budgets[k]; }
  });
  Object.values(d.trading || {}).forEach(e => {
    if (!Array.isArray(e.trades)) e.trades = [];
    if (e.emotion === undefined) e.emotion = null;
  });
  d.meta.schema = 3;
  return d;
}

let data = loadData();
let tab = "today";
let financeSub = "summary";
let financeMonthMode = "month";
let financeCursor = (() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })();
let todoStatusFilter = "open";
let todoDeadlineFilter = "all";
let goalDeadlineFilter = "all";
let openGoalId = null;
let calCursor = (() => { const d = new Date(); return {year: d.getFullYear(), month: d.getMonth()}; })();
let tradingCursor = (() => { const d = new Date(); return {year: d.getFullYear(), month: d.getMonth()}; })();
let tradingSelected = todayStr();
let tradingDraft = { pnl: "", notes: "", emotion: null };
let tradeEntryDraft = { setup: "", r: "", followedPlan: true };
let searchOpen = false;
let searchQuery = "";
let showArchive = false;
let financeDrafts = {
  income: { date: todayStr(), name: "", amount: "" },
  investments: { date: todayStr(), name: "", amount: "" },
  expenses: { date: todayStr(), name: "", category: EXPENSE_CATEGORIES[0], amount: "" },
};
let nwDraft = { date: todayStr(), amount: "", note: "" };
let subDraft = { name: "", amount: "", cycle: "monthly" };

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e) { console.error("save failed", e); alert("Nepavyko išsaugoti — gali būti pilna naršyklės atmintis. Pasidaryk backup."); }
  render();
}

// ---------- derived: habits ----------
const activeHabits = () => data.habits.filter(h => !h.archived);
const activeTodos  = () => data.todos.filter(t => !t.archived);
const activeGoals  = () => data.goals.filter(g => !g.archived);

// Streak that survives one miss per rolling 7 days — a single slipped
// evening shouldn't wipe out weeks of work.
function habitStreak(h) {
  const hist = h.history || {};
  let streak = 0;
  const misses = [];
  let cursor = todayStr();
  if (!hist[cursor]) cursor = addDays(cursor, -1); // today is still in play
  for (let i = 0; i < 730; i++) {
    if (hist[cursor]) streak++;
    else {
      const nearby = misses.filter(m => Math.abs(daysBetween(m, cursor)) < 7).length;
      if (nearby >= 1) break;
      misses.push(cursor);
    }
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function habitRate(h, days) {
  const hist = h.history || {};
  let hit = 0;
  for (let i = 0; i < days; i++) if (hist[addDays(todayStr(), -i)]) hit++;
  return Math.round((hit / days) * 100);
}

// ---------- derived: goals ----------
function goalTasks(goalId) { return activeTodos().filter(t => t.goalId === goalId); }
function goalProgress(g) {
  const tasks = goalTasks(g.id);
  if (tasks.length) return Math.round((tasks.filter(t => t.done).length / tasks.length) * 100);
  return Number(g.manualProgress) || 0;
}
function goalIsAuto(g) { return goalTasks(g.id).length > 0; }

// ---------- derived: finance ----------
function monthEntries(list, mk) { return list.filter(e => monthKey(e.date) === mk); }
function monthTotals(mk) {
  const income = sum(monthEntries(data.finance.income, mk));
  const expenses = sum(monthEntries(data.finance.expenses, mk));
  const investments = sum(monthEntries(data.finance.investments, mk));
  return { income, expenses, investments, net: income - expenses };
}
function savingsRate(mk) {
  const { income, expenses } = monthTotals(mk);
  if (income <= 0) return null;
  return Math.round(((income - expenses) / income) * 100);
}
// Average monthly spend over the last N complete-ish months that have data.
function avgMonthlyExpenses(months = 3) {
  const seen = {};
  data.finance.expenses.forEach(e => {
    const mk = monthKey(e.date); if (!mk) return;
    seen[mk] = (seen[mk] || 0) + Number(e.amount || 0);
  });
  const keys = Object.keys(seen).sort().slice(-months);
  if (!keys.length) return 0;
  return keys.reduce((s,k) => s + seen[k], 0) / keys.length;
}
function latestNetWorth() {
  if (!data.netWorth.length) return null;
  return [...data.netWorth].sort((a,b) => a.date.localeCompare(b.date))[data.netWorth.length-1];
}
function runwayMonths() {
  const nw = latestNetWorth();
  const burn = avgMonthlyExpenses(3);
  if (!nw || burn <= 0) return null;
  return Number(nw.amount) / burn;
}
function subsMonthly() {
  return data.subscriptions.reduce((s, x) => s + (x.cycle === "yearly" ? Number(x.amount||0)/12 : Number(x.amount||0)), 0);
}

// Tiny inline line chart. No libraries — it has to work offline.
function sparkline(points, width, height, color) {
  if (points.length < 2) return "";
  const xs = points.map((p,i)=>i), ys = points.map(p=>p.v);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = (maxY - minY) || 1;
  const px = (i) => (i / (points.length - 1)) * (width - 8) + 4;
  const py = (v) => height - 6 - ((v - minY) / span) * (height - 16);
  const d = points.map((p,i) => `${i?'L':'M'}${px(i).toFixed(1)},${py(p.v).toFixed(1)}`).join(" ");
  const area = `${d} L${px(points.length-1).toFixed(1)},${height} L${px(0).toFixed(1)},${height} Z`;
  const dots = points.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="2.5" fill="${color}"/>`).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img" aria-label="Pokytis laike">
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function budgetBars(byCategory) {
  const cats = EXPENSE_CATEGORIES.filter(c => data.budgets[c] || byCategory[c]);
  if (!cats.length) return empty("Nustatyk biudžetą kategorijoms, kad matytum planą prieš faktą.");
  return cats.map(c => {
    const planned = Number(data.budgets[c] || 0);
    const actual = Number(byCategory[c] || 0);
    const pct = planned > 0 ? Math.min(100, (actual / planned) * 100) : (actual > 0 ? 100 : 0);
    const over = planned > 0 && actual > planned;
    const color = over ? "var(--red)" : pct > 80 ? "var(--gold)" : "var(--green)";
    return `<div class="bar-row">
      <div class="kv">
        <span>${esc(c)}</span>
        <span class="mono" style="font-size:12px">${fmtMoney0(actual)}${planned>0?` / ${fmtMoney0(planned)}`:" (be plano)"}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      ${over ? `<div class="mono" style="font-size:11px;margin-top:3px">Viršyta ${fmtMoney0(actual-planned)}</div>` : ""}
    </div>`;
  }).join("");
}

  const incomeList = data.finance.income.filter(inRange);

  const expenseList = data.finance.expenses.filter(inRange);
  const income = sum(incomeList), investments = sum(investList), expenses = sum(expenseList);
  const net = income - expenses;
  const rate = income > 0 ? Math.round(((income - expenses) / income) * 100) : null;

  const byCategory = {};

// ---------- Habits + patterns ----------
// Correlations only appear once there's enough logged data to mean anything.
function insights() {
  const days = Object.keys(data.daily).filter(d => data.daily[d] && (data.daily[d].energy || data.daily[d].mood));
  if (days.length < 10) return { ready: false, need: 10 - days.length };
  const avg = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0) / arr.length : null;
  const habits = activeHabits();

  const woEnergy = [], noWoEnergy = [], habitMood = [], noHabitMood = [];
  days.forEach(d => {
    const e = data.daily[d];
    if (e.energy) (data.workouts[d] ? woEnergy : noWoEnergy).push(Number(e.energy));
    if (e.mood && habits.length) {
      const doneCount = habits.filter(h => (h.history||{})[d]).length;
      (doneCount >= Math.ceil(habits.length/2) ? habitMood : noHabitMood).push(Number(e.mood));
    }
  });

  const out = [];
  const a1 = avg(woEnergy), b1 = avg(noWoEnergy);
  if (a1 !== null && b1 !== null && woEnergy.length >= 3 && noWoEnergy.length >= 3) {
    const diff = a1 - b1;
    out.push({
      label: "Treniruotės ir energija",
      value: `${a1.toFixed(1)} prieš ${b1.toFixed(1)}`,
      text: diff > 0.3 ? `Treniruočių dienomis energija aukštesnė ${diff.toFixed(1)} balo.`
           : diff < -0.3 ? `Treniruočių dienomis energija žemesnė ${Math.abs(diff).toFixed(1)} balo — gali būti per didelis krūvis.`
           : "Ryšio tarp treniruočių ir energijos kol kas nematyti."
    });
  }
  const a2 = avg(habitMood), b2 = avg(noHabitMood);
  if (a2 !== null && b2 !== null && habitMood.length >= 3 && noHabitMood.length >= 3) {
    const diff = a2 - b2;
    out.push({
      label: "Įpročiai ir nuotaika",
      value: `${a2.toFixed(1)} prieš ${b2.toFixed(1)}`,
      text: diff > 0.3 ? `Dienomis, kai išlaikai įpročius, nuotaika geresnė ${diff.toFixed(1)} balo.`
           : "Aiškaus skirtumo dar nematyti."
    });
  }
  const allEnergy = days.map(d => Number(data.daily[d].energy)).filter(Boolean);
  if (allEnergy.length >= 5) {
    out.push({ label: "Vidutinė energija", value: avg(allEnergy).toFixed(1) + "/5", text: `Pagal ${allEnergy.length} užfiksuotų dienų.` });
  }
  return { ready: true, items: out, days: days.length };
}

function renderWorkouts() {
  const {year, month} = calCursor;
  const label = monthLabelOf(year, month);
  const firstDay = (new Date(year, month, 1).getDay() + 6) % 7; // week starts Monday
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const key = (day) => `${year}-${pad(month+1)}-${pad(day)}`;
  let monthCount = 0;
  for (let d=1; d<=daysInMonth; d++) if (data.workouts[key(d)]) monthCount++;
  const todayKey = todayStr();

  // Weekly average across the month so far.
  const weeks = Math.max(1, Math.ceil(daysInMonth / 7));
  const perWeek = (monthCount / weeks).toFixed(1);

  let cells = "";
  for (let i=0;i<firstDay;i++) cells += `<div></div>`;
  for (let d=1;d<=daysInMonth;d++) {

  const dayLabels = ["P","A","T","K","P","Š","S"].map(d=>`<div class="cal-day-label">${d}</div>`).join("");

  return header("Treniruočių žurnalas","Treniruotės", `<span class="mono" style="font-size:12px">${monthCount} šį mėnesį · ${perWeek}/sav.</span>`) + `

      <span style="display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--blue);margin-left:10px"></span> Šiandien

// ---------- Trading ----------
function allSetups() {
  const set = new Set();
  Object.values(data.trading||{}).forEach(e => (e.trades||[]).forEach(t => { if (t.setup) set.add(t.setup); }));
  return [...set].sort();
}

function tradingStats(year, month) {
  const prefix = `${year}-${pad(month+1)}`;
  let pnl = 0, wins = 0, losses = 0, totalR = 0, rCount = 0, planned = 0, tradeCount = 0;
  const bySetup = {};
  Object.entries(data.trading||{}).forEach(([date, e]) => {
    if (!date.startsWith(prefix)) return;
    pnl += Number(e.pnl) || 0;
    const trades = e.trades || [];
    if (trades.length) {
      trades.forEach(t => {
        tradeCount++;
        const r = Number(t.r) || 0;
        totalR += r; rCount++;
        if (r > 0) wins++; else if (r < 0) losses++;
        if (t.followedPlan) planned++;
        const s = t.setup || "Be žymos";
        bySetup[s] = bySetup[s] || { n: 0, w: 0, r: 0 };
        bySetup[s].n++; bySetup[s].r += r;
        if (r > 0) bySetup[s].w++;
      });
    } else {
      // legacy day-level counts
      wins += Number(e.wins) || 0;
      losses += Number(e.losses) || 0;
      tradeCount += (Number(e.wins)||0) + (Number(e.losses)||0);
    }
  });
  const decided = wins + losses;
  return {
    pnl, wins, losses, tradeCount,
    winRate: decided ? Math.round((wins/decided)*100) : null,
    totalR: rCount ? totalR : null,
    avgR: rCount ? totalR / rCount : null,
    adherence: rCount ? Math.round((planned/rCount)*100) : null,
    bySetup,
  };
}

function renderTrading() {
  const {year, month} = tradingCursor;
  const label = monthLabelOf(year, month);
  const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const key = (day) => `${year}-${pad(month+1)}-${pad(day)}`;
  const trading = data.trading || {};
  const s = tradingStats(year, month);
  const todayKey = todayStr();

  let cells = "";
  for (let i=0;i<firstDay;i++) cells += `<div></div>`;
  for (let d=1;d<=daysInMonth;d++) {
    const k = key(d);
    const e = trading[k];
    const isToday = k === todayKey;
    const isSelected = k === tradingSelected;
    let bg = "";
    if (e) bg = (e.pnl > 0) ? "win" : (e.pnl < 0) ? "loss" : "";
    const lbl = e && (e.pnl || (e.trades||[]).length || e.wins || e.losses)
      ? `<br><span style="font-size:9px">${e.pnl>0?'+':''}${Math.round(e.pnl||0)}</span>` : "";
    cells += `<button class="cal-cell trade-cell ${bg} ${isSelected?'selected':''} ${isToday&&!isSelected?'today':''}" onclick="selectTradingDay('${k}')" aria-label="${k}">${d}${lbl}</button>`;
  }
  const dayLabels = ["P","A","T","K","P","Š","S"].map(d=>`<div class="cal-day-label">${d}</div>`).join("");

  const entry = trading[tradingSelected] || {};
  const dayTrades = entry.trades || [];
  const setupRows = Object.entries(s.bySetup).sort((a,b)=>b[1].r-a[1].r).map(([name, v], i) => `
    <tr class="${i%2===0?'':'odd'}">
      <td>${esc(name)}</td>
      <td style="text-align:right;font-family:monospace">${v.n}</td>
      <td style="text-align:right;font-family:monospace">${Math.round((v.w/v.n)*100)}%</td>
      <td style="text-align:right;font-family:monospace;color:${v.r>=0?'var(--green-ink)':'var(--red)'}">${v.r>=0?'+':''}${v.r.toFixed(2)}R</td>
    </tr>`).join("");

  const tradeRows = dayTrades.map(t => `<li style="padding:8px 10px">
    <span class="tag ${t.followedPlan?'ok':'warn'}">${t.followedPlan?'Pagal planą':'Nukrypau'}</span>

// ---------- Search ----------
function searchResults(q) {
  const needle = q.trim().toLowerCase();
  if (needle.length < 2) return [];
  const hit = (s) => String(s||"").toLowerCase().includes(needle);
  const out = [];

  data.todos.forEach(t => { if (hit(t.text)) out.push({ area:"Darbai", tab:"todo", title:t.text, meta:(t.archived?"archyvuota · ":"")+(t.due||"be datos") }); });
  data.goals.forEach(g => { if (hit(g.title) || hit(g.why)) out.push({ area:"Tikslai", tab:"goals", title:g.title, meta:g.category + (g.deadline?` · iki ${g.deadline}`:"") }); });
  data.habits.forEach(h => { if (hit(h.name)) out.push({ area:"Įpročiai", tab:"productivity", title:h.name, meta:`${habitStreak(h)} d. serija` }); });
  [["income","Pajamos"],["investments","Investicijos"],["expenses","Išlaidos"]].forEach(([k, lbl]) => {
    data.finance[k].forEach(e => { if (hit(e.name) || hit(e.category)) out.push({ area:lbl, tab:"finance", title:e.name, meta:`${e.date} · ${fmtMoney(e.amount)}` }); });
  });
  data.subscriptions.forEach(s => { if (hit(s.name)) out.push({ area:"Prenumeratos", tab:"finance", title:s.name, meta:fmtMoney(s.amount) }); });
  data.netWorth.forEach(e => { if (hit(e.note)) out.push({ area:"Turtas", tab:"finance", title:e.note, meta:`${e.date} · ${fmtMoney(e.amount)}` }); });
  Object.entries(data.trading||{}).forEach(([d, e]) => {
    if (hit(e.notes) || (e.trades||[]).some(t => hit(t.setup))) out.push({ area:"Prekyba", tab:"trading", title:(e.notes||"Sandoriai").slice(0,90), meta:`${d} · ${fmtMoney(e.pnl||0)}`, date:d });
  });
  Object.entries(data.daily).forEach(([d, e]) => { if (hit(e.note)) out.push({ area:"Dienoraštis", tab:"today", title:e.note.slice(0,90), meta:d }); });
  Object.entries(data.finance.notes||{}).forEach(([m, n]) => { if (hit(n)) out.push({ area:"Mėnesio pastaba", tab:"finance", title:n.slice(0,90), meta:m }); });

  return out.slice(0, 40);
}

function renderSearchBody() {
  const res = searchResults(searchQuery);
  if (searchQuery.trim().length < 2) return `<p class="muted" style="font-size:13px">Įvesk bent 2 simbolius.</p>`;
  if (!res.length) return `<p class="muted" style="font-size:13px">Nieko nerasta pagal „${esc(searchQuery)}“.</p>`;
  return `<ul class="list">${res.map(r => `<li>
    <span class="tag">${esc(r.area)}</span>
    <span style="flex:1;font-size:14px;min-width:0">${esc(r.title)}</span>
    <span class="mono muted" style="font-size:11px">${esc(r.meta)}</span>
    <button class="iconbtn" style="text-decoration:underline" onclick="gotoResult('${r.tab}','${r.date||''}')">Eiti</button>
  </li>`).join("")}</ul>`;
}

function searchModal() {
  return `<div class="modal-back" onclick="if(event.target===this)closeSearch()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Paieška">
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input id="search-input" class="flex1" placeholder="Ieškoti visame Life Ledger..." value="${attr(searchQuery)}" oninput="onSearchInput(this.value)">
        <button class="btn ghost" onclick="closeSearch()">Uždaryti</button>
      </div>
      <div id="search-results">${renderSearchBody()}</div>
    </div>
  </div>`;
}

// ---------- Archive ----------
function archiveModal() {
  const t = data.todos.filter(x => x.archived);
  const g = data.goals.filter(x => x.archived);
  const h = data.habits.filter(x => x.archived);
  const block = (title, items, nameFn, restoreFn, deleteFn) => `
    <div class="eyebrow" style="margin-top:16px">${title} (${items.length})</div>
    ${items.length ? `<ul class="list">${items.map(x => `<li>
      <span style="flex:1;font-size:14px">${esc(nameFn(x))}</span>
      <button class="iconbtn" style="text-decoration:underline" onclick="${restoreFn}('${x.id}')">Grąžinti</button>
      <button class="trash" style="margin:0" title="Ištrinti visam laikui" onclick="${deleteFn}('${x.id}')">✕</button>
    </li>`).join("")}</ul>` : `<p class="muted" style="font-size:13px;margin:4px 0 0">Tuščia.</p>`}`;

  return `<div class="modal-back" onclick="if(event.target===this)toggleArchive()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Archyvas">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 class="serif" style="margin:0;font-size:22px">Archyvas</h2>
        <button class="btn ghost" onclick="toggleArchive()">Uždaryti</button>
      </div>
      <p class="muted" style="font-size:13px">Archyvuoti įrašai nedingsta iš istorijos. Ištrynimas negrįžtamas.</p>
      ${block("Darbai", t, x=>x.text, "restoreTodo", "deleteTodo")}
      ${block("Tikslai", g, x=>x.title, "restoreGoal", "deleteGoal")}
      ${block("Įpročiai", h, x=>x.name, "restoreHabit", "deleteHabit")}
    </div>
  </div>`;
}

// ---------- backup reminder ----------
function daysSinceBackup() {
  const last = data.meta && data.meta.lastBackup;
  if (!last) return null;
  return daysBetween(last, todayStr());
}
function backupBanner() {
  const hasData = data.todos.length || data.goals.length || data.finance.expenses.length || Object.keys(data.trading||{}).length;
  if (!hasData) return "";
  const d = daysSinceBackup();
  if (d === null) return `<div class="banner">
    <span style="flex:1">Dar nesi darę atsarginės kopijos. Duomenys laikomi tik šioje naršyklėje.</span>
    <button class="btn" style="background:var(--blue)" onclick="exportData()">Daryti kopiją</button></div>`;
  if (d >= 7) return `<div class="banner">
    <span style="flex:1">Paskutinė kopija prieš ${d} d. Laikas naujai.</span>
    <button class="btn" style="background:var(--blue)" onclick="exportData()">Daryti kopiją</button></div>`;
  return "";
}

  let content = "";
  if (tab==="today") content = renderToday();
  else if (tab==="goals") content = renderGoals();
  else if (tab==="todo") content = renderTodo();
  else if (tab==="finance") content = renderFinance();
  else if (tab==="productivity") content = renderProductivity();
  else if (tab==="workouts") content = renderWorkouts();
  else if (tab==="trading") content = renderTrading();

  document.getElementById("app").innerHTML = `
    <header class="topbar">
      <div class="serif" style="font-size:18px">Life Ledger</div>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="iconbtn" onclick="openSearch()" aria-label="Paieška">${svgIcon('search')}</button>
        <button class="iconbtn" onclick="toggleArchive()" aria-label="Archyvas">${svgIcon('archive')}</button>
        <button class="iconbtn" onclick="exportData()">⬇</button>
        <button class="iconbtn" onclick="document.getElementById('import-input').click()">⬆</button>
      </div>
    </header>
    <div class="layout">
      <aside>
        <div class="logo serif">Life<br>Ledger</div>
        <div class="sub mono">asmeninė valdymo patalpa</div>
        <button class="pill" onclick="openSearch()" style="display:flex;align-items:center;gap:8px;margin-bottom:14px;text-align:left;cursor:pointer">
          ${svgIcon('search')}<span style="font-size:13px">Ieškoti</span>
        </button>
        <nav class="sidenav">${navBtns()}</nav>
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:16px;border-top:1px solid var(--line)">
          <button class="iconbtn" style="text-align:left" onclick="toggleArchive()">Archyvas</button>
          <button class="iconbtn" style="text-align:left" onclick="exportData()">⬇ Daryti kopiją</button>
          <button class="iconbtn" style="text-align:left" onclick="document.getElementById('import-input').click()">⬆ Atkurti iš failo</button>
          <div class="mono muted" style="font-size:10px;padding:6px 6px 0">
            ${data.meta.lastBackup ? `Kopija: ${data.meta.lastBackup}` : "Kopijų dar nėra"}

// ---------- navigation & filters ----------
function goTab(id) { tab = id; searchOpen = false; showArchive = false; window.scrollTo(0,0); render(); }
function setTodoStatus(f) { todoStatusFilter = f; render(); }
function setTodoDeadline(f) { todoDeadlineFilter = f; render(); }
function setGoalDeadline(f) { goalDeadlineFilter = f; render(); }
function setFinanceSub(s) { financeSub = s; render(); }
function setFinanceMonthMode(mode) { financeMonthMode = mode; render(); }
function shiftFinanceMonth(delta) {
  let { year, month } = financeCursor;
  month += delta;
  if (month < 0) { month = 11; year -= 1; }
  if (month > 11) { month = 0; year += 1; }
  financeCursor = { year, month }; render();
}

// ---------- todos ----------
function addTodo() {
  const textEl = document.getElementById("todo-text");
  const dueEl = document.getElementById("todo-due");
  const goalEl = document.getElementById("todo-goal");
  if (!textEl.value.trim()) return;
  data.todos.push({ id: uid(), text: textEl.value.trim(), done: false, due: dueEl.value || null,
                    goalId: goalEl && goalEl.value ? goalEl.value : null, archived: false, created: todayStr() });
  saveData();
}
function addQuickTask() {
  const el = document.getElementById("quick-task");
  if (!el || !el.value.trim()) return;
  data.todos.push({ id: uid(), text: el.value.trim(), done: false, due: todayStr(), goalId: null, archived: false, created: todayStr() });
  saveData();
}
function toggleTodo(id) { const t = data.todos.find(t=>t.id===id); if(t) t.done = !t.done; saveData(); }
function archiveTodo(id) { const t = data.todos.find(t=>t.id===id); if(t) t.archived = true; saveData(); }
function restoreTodo(id) { const t = data.todos.find(t=>t.id===id); if(t) t.archived = false; saveData(); }
function deleteTodo(id) { if(confirm("Ištrinti visam laikui?")) { data.todos = data.todos.filter(t=>t.id!==id); saveData(); } }
function unlinkTask(id) { const t = data.todos.find(t=>t.id===id); if(t) t.goalId = null; saveData(); }

// ---------- goals ----------
function addGoal() {
  const titleEl = document.getElementById("goal-title");
  const catEl = document.getElementById("goal-cat");
  const deadlineEl = document.getElementById("goal-deadline");
  if (!titleEl.value.trim()) return;
  data.goals.push({ id: uid(), title: titleEl.value.trim(), category: catEl.value, manualProgress: 0,
                    deadline: deadlineEl.value || null, why: "", habitIds: [], archived: false });
  saveData();
}
function setGoalProgress(id, val) { const g = data.goals.find(g=>g.id===id); if(g){ g.manualProgress = Number(val); g.progress = Number(val); saveData(); } }
function setGoalWhy(id, val) { const g = data.goals.find(g=>g.id===id); if(g){ g.why = val; saveData(); } }
function toggleGoalOpen(id) { openGoalId = openGoalId === id ? null : id; render(); }
function addGoalTask(goalId) {
  const el = document.getElementById("goal-task-" + goalId);
  const dueEl = document.getElementById("goal-task-due-" + goalId);
  if (!el || !el.value.trim()) return;
  data.todos.push({ id: uid(), text: el.value.trim(), done: false, due: (dueEl && dueEl.value) || null,
                    goalId, archived: false, created: todayStr() });
  saveData();
}
function toggleGoalHabit(goalId, habitId) {
  const g = data.goals.find(g=>g.id===goalId); if (!g) return;
  g.habitIds = g.habitIds || [];
  g.habitIds = g.habitIds.includes(habitId) ? g.habitIds.filter(x=>x!==habitId) : [...g.habitIds, habitId];
  saveData();
}
function archiveGoal(id) { const g = data.goals.find(g=>g.id===id); if(g) g.archived = true; if(openGoalId===id) openGoalId=null; saveData(); }
function restoreGoal(id) { const g = data.goals.find(g=>g.id===id); if(g) g.archived = false; saveData(); }
function deleteGoal(id) { if(confirm("Ištrinti visam laikui?")) { data.goals = data.goals.filter(g=>g.id!==id); saveData(); } }

// ---------- finance ----------
function updateDraft(key, field, value) { financeDrafts[key][field] = value; }
function submitFinance(key) {
  const draft = financeDrafts[key];
  if (!draft.name.trim() || draft.amount === "" || isNaN(Number(draft.amount))) return;
  const entry = { id: uid(), date: draft.date || todayStr(), name: draft.name.trim(), amount: Number(draft.amount) };
  if (draft.category) entry.category = draft.category;
  data.finance[key].push(entry);
  financeDrafts[key] = key === "expenses"
    ? { date: draft.date || todayStr(), name: "", category: draft.category, amount: "" }
    : { date: draft.date || todayStr(), name: "", amount: "" };
  saveData();
}
function removeFinanceRow(key, id) { if(confirm("Ištrinti eilutę?")) { data.finance[key] = data.finance[key].filter(e=>e.id!==id); saveData(); } }
function setMonthNote(mk, val) { data.finance.notes = data.finance.notes || {}; data.finance.notes[mk] = val; saveData(); }
function setBudget(cat, val) {
  if (val === "" || isNaN(Number(val))) delete data.budgets[cat];
  else data.budgets[cat] = Number(val);
  saveData();
}
function updateSubDraft(f, v) { subDraft[f] = v; }
function addSubscription() {
  if (!subDraft.name.trim() || subDraft.amount === "" || isNaN(Number(subDraft.amount))) return;
  data.subscriptions.push({ id: uid(), name: subDraft.name.trim(), amount: Number(subDraft.amount), cycle: subDraft.cycle });
  subDraft = { name: "", amount: "", cycle: subDraft.cycle };
  saveData();
}
function removeSubscription(id) { data.subscriptions = data.subscriptions.filter(s=>s.id!==id); saveData(); }
function updateNwDraft(f, v) { nwDraft[f] = v; }
function addNetWorth() {
  if (nwDraft.amount === "" || isNaN(Number(nwDraft.amount))) return;
  const date = nwDraft.date || todayStr();
  data.netWorth = data.netWorth.filter(e => e.date !== date); // one snapshot per date
  data.netWorth.push({ id: uid(), date, amount: Number(nwDraft.amount), note: nwDraft.note.trim() });
  nwDraft = { date: todayStr(), amount: "", note: "" };
  saveData();
}
function removeNetWorth(id) { data.netWorth = data.netWorth.filter(e=>e.id!==id); saveData(); }

// ---------- habits ----------
function addHabit() {
  const el = document.getElementById("habit-name");
  if (!el.value.trim()) return;
  data.habits.push({ id: uid(), name: el.value.trim(), history: {}, streak: 0, lastDone: null, archived: false });
  saveData();
}
function toggleHabit(id) {
  const h = data.habits.find(h=>h.id===id); if (!h) return;
  const today = todayStr();
  h.history = h.history || {};
  if (h.history[today]) delete h.history[today]; else h.history[today] = true;
  h.streak = habitStreak(h);
  h.lastDone = h.history[today] ? today : h.lastDone;
  saveData();
}
function archiveHabit(id) { const h = data.habits.find(h=>h.id===id); if(h) h.archived = true; saveData(); }
function restoreHabit(id) { const h = data.habits.find(h=>h.id===id); if(h) h.archived = false; saveData(); }
function deleteHabit(id) { if(confirm("Ištrinti visam laikui? Istorija dings.")) { data.habits = data.habits.filter(h=>h.id!==id); saveData(); } }

// ---------- daily check-in ----------
function setMood(n) { const d = todayStr(); data.daily[d] = { ...(data.daily[d]||{}), mood: n }; saveData(); }
function setEnergy(n) { const d = todayStr(); data.daily[d] = { ...(data.daily[d]||{}), energy: n }; saveData(); }
function setDayNote(v) { const d = todayStr(); data.daily[d] = { ...(data.daily[d]||{}), note: v }; saveData(); }

// ---------- workouts ----------
function shiftMonth(delta) {
  let {year, month} = calCursor;
  month += delta;
  if (month < 0) { month = 11; year -= 1; }
  if (month > 11) { month = 0; year += 1; }
  calCursor = {year, month}; render();
}
function toggleWorkout(day) {
  const {year, month} = calCursor;
  const k = `${year}-${pad(month+1)}-${pad(day)}`;
  if (data.workouts[k]) delete data.workouts[k]; else data.workouts[k] = true;
  saveData();
}
function toggleWorkoutToday() {
  const k = todayStr();
  if (data.workouts[k]) delete data.workouts[k]; else data.workouts[k] = true;
  saveData();
}

// ---------- trading ----------
function shiftTradingMonth(delta) {
  let {year, month} = tradingCursor;
  month += delta;
  if (month < 0) { month = 11; year -= 1; }
  if (month > 11) { month = 0; year += 1; }
  tradingCursor = {year, month}; render();
}
function ensureTradingDay() {
  data.trading = data.trading || {};
  if (!data.trading[tradingSelected]) data.trading[tradingSelected] = { pnl: 0, notes: "", emotion: null, trades: [] };
  return data.trading[tradingSelected];
}
function selectTradingDay(dateStr) { tradingSelected = dateStr; render(); }
function setTradingPnl(v) { const e = ensureTradingDay(); e.pnl = Number(v) || 0; saveData(); }
function setTradingNotes(v) { const e = ensureTradingDay(); e.notes = v; saveData(); }
function setTradingEmotion(n) { const e = ensureTradingDay(); e.emotion = n; saveData(); }
function updateTradeDraft(f, v) { tradeEntryDraft[f] = v; }
function toggleTradeDraftPlan() { tradeEntryDraft.followedPlan = !tradeEntryDraft.followedPlan; render(); }
function addTrade() {
  if (tradeEntryDraft.r === "" || isNaN(Number(tradeEntryDraft.r))) return;
  const e = ensureTradingDay();
  e.trades = e.trades || [];
  e.trades.push({ id: uid(), setup: tradeEntryDraft.setup.trim(), r: Number(tradeEntryDraft.r), followedPlan: !!tradeEntryDraft.followedPlan });
  tradeEntryDraft = { setup: tradeEntryDraft.setup, r: "", followedPlan: true };
  saveData();
}
function removeTrade(id) {
  const e = (data.trading||{})[tradingSelected]; if (!e) return;
  e.trades = (e.trades||[]).filter(t => t.id !== id);
  saveData();
}
function clearTradingDay() {
  if (!confirm("Išvalyti visą šios dienos įrašą?")) return;
  if (data.trading) delete data.trading[tradingSelected];
  saveData();
}

// ---------- search / archive controls ----------
function openSearch() { searchOpen = true; showArchive = false; render(); }
function closeSearch() { searchOpen = false; searchQuery = ""; render(); }
function onSearchInput(v) {
  searchQuery = v;
  const box = document.getElementById("search-results");
  if (box) box.innerHTML = renderSearchBody(); // partial update keeps the caret in place
}
function gotoResult(t, date) {
  if (t === "trading" && date) { tradingSelected = date; tradingCursor = { year: Number(date.slice(0,4)), month: Number(date.slice(5,7))-1 }; }
  goTab(t);
}
function toggleArchive() { showArchive = !showArchive; searchOpen = false; render(); }

// ---------- backup ----------
function exportData() {
  data.meta = data.meta || {};
  data.meta.lastBackup = todayStr();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `life-ledger-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  render();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (typeof imported !== "object" || imported === null) throw new Error("bad shape");
      if (!confirm("Atkūrimas pakeis visus dabartinius duomenis. Tęsti?")) return;
      const def = defaults();
      data = migrate({
        ...def, ...imported,
        finance: { ...def.finance, ...(imported.finance || {}), notes: (imported.finance && imported.finance.notes) || {} },
        meta: { ...def.meta, ...(imported.meta || {}) },
      });
      saveData();
      alert("Duomenys atkurti.");
    } catch (err) {
      alert("Nepavyko nuskaityti failo — įsitikink, kad tai anksčiau eksportuotas .json failas.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

// ---------- boot ----------
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
  if (e.key === "Escape") { if (searchOpen) closeSearch(); else if (showArchive) toggleArchive(); }
});

// Re-render across midnight so "today" stays honest on a phone left open.
let bootDay = todayStr();
setInterval(() => { if (todayStr() !== bootDay) { bootDay = todayStr(); tradingSelected = bootDay; render(); } }, 60000);

// Optional offline cache. Works only if sw.js sits next to this file; ignored otherwise.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

render();
</script>
